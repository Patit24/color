services:
  web:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build: ./backend
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mongo-data:
