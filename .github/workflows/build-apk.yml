name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API Base URL (e.g. http://192.168.1.50:8080/api or https://yourdomain.com/api)'
        required: true
        default: 'http://localhost:8080/api'
      socket_url:
        description: 'Real-time Socket URL (e.g. http://192.168.1.50:8080 or https://yourdomain.com)'
        required: true
        default: 'http://localhost:8080'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Create .env file for build
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ github.event.inputs.api_url || secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8080/api' }}" > .env
          echo "NEXT_PUBLIC_SOCKET_URL=${{ github.event.inputs.socket_url || secrets.NEXT_PUBLIC_SOCKET_URL || 'http://localhost:8080' }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyBJ3MjAs_MRszfg_Y0JczR0qTaBlU3jSJs' }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'color-trade-4a76f.firebaseapp.com' }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'color-trade-4a76f' }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'color-trade-4a76f.firebasestorage.app' }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '471311069473' }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:471311069473:web:6cb1b046eb583dcf6d0e60' }}" >> .env
          echo "NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || 'rzp_live_SggUT5PeRZ5V43' }}" >> .env
          echo "Build-time environment variables configured:"
          cat .env | grep -E "NEXT_PUBLIC_"
        
      - name: Build Next.js app
        run: npm run build
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
          
      - name: Capacitor Sync
        run: npx cap sync android
          
      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace --info
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          
      - name: Upload Gradle Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            android/app/build/reports/
            android/.gradle/
